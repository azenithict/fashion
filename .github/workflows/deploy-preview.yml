name: Deploy private preview
on:
  workflow_run:
    workflows: [Build and test]
    types: [completed]
    branches: [feature/launch-experience]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful push Build and test run ID for feature/launch-experience
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: cpanel-private-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.CPANEL_PREVIEW_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: cpanel-preview
    steps:
      - name: Validate successful source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['RUNNER_TEMP']+'/source-run.json'))
          assert r['conclusion']=='success' and r['event']=='push'
          assert r['head_branch']=='feature/launch-experience'
          assert r['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert r['path']=='.github/workflows/ci.yml'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+r['head_sha']+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fashion-private-preview
          path: preview-artifact
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install private SSH identity
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/cpanel_preview
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Stage and activate code-only private preview
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_PORT: ${{ vars.CPANEL_PORT }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$CPANEL_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          CPANEL_PORT="${CPANEL_PORT:-22}"
          [[ "$CPANEL_PORT" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          archive="preview-artifact/zenith-${SOURCE_SHA:0:12}-preview.tar.gz"
          test -f "$archive"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          ssh_args=(-i "$HOME/.ssh/cpanel_preview" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" -p "$CPANEL_PORT" "isp85@$CPANEL_HOST" 'umask 077; mkdir -p /home/isp85/fashion-private/deploy-inbox'
          scp "${ssh_args[@]}" -P "$CPANEL_PORT" "$archive" scripts/stage-cpanel-release.sh "isp85@$CPANEL_HOST:/home/isp85/fashion-private/deploy-inbox/"
          # A previously staged release is retained, allowing activation retries without re-extraction.
          ssh "${ssh_args[@]}" -p "$CPANEL_PORT" "isp85@$CPANEL_HOST" bash -s -- "$SOURCE_SHA" "$digest" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          digest="$2"
          private=/home/isp85/fashion-private
          release="$private/preview-releases/$sha"
          if [[ ! -d "$release" ]]; then
            bash "$private/deploy-inbox/stage-cpanel-release.sh" "$private/deploy-inbox/zenith-${sha:0:12}-preview.tar.gz" "$private" "$digest"
          fi
          /usr/local/bin/php "$release/private/backend/bin/activate-preview.php" --release "$release"
          REMOTE
      - name: Remove runner SSH identity
        if: always()
        run: rm -f ~/.ssh/cpanel_preview ~/.ssh/known_hosts
