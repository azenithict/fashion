name: Build and test
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**", "fix/**"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Package coherent cPanel release
        run: |
          git restore next-env.d.ts
          python3 scripts/package-cpanel.py
      - name: Verify production package staging
        run: python3 tests/staging.py "dist/zenith-$(git rev-parse --short=12 HEAD).tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: fashion-cpanel-release
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Build owner-only preview frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /_fashion-preview
        run: |
          npm run build
          git restore next-env.d.ts
          python3 scripts/package-cpanel.py --variant preview
      - name: Verify preview package staging
        run: python3 tests/staging.py "dist/zenith-$(git rev-parse --short=12 HEAD)-preview.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: fashion-private-preview
          path: dist/*-preview.tar.gz
          if-no-files-found: error
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: zenith_test
          MARIADB_USER: zenith_test
          MARIADB_PASSWORD: test-only-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      restore:
        image: mariadb:10.11
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: zenith_test
          MARIADB_USER: zenith_test
          MARIADB_PASSWORD: test-only-ci-password
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      configsetup:
        image: mariadb:10.11
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: isp85_fashion
          MARIADB_USER: isp85_fashion
          MARIADB_PASSWORD: "test-only-'quote-2026!"
        ports: ['3308:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ZENITH_CONFIG_TEST_HOST: 127.0.0.1
      ZENITH_CONFIG_TEST_PORT: 3308
      ZENITH_PREVIEW_INSTALL_HOST: 127.0.0.1
      ZENITH_PREVIEW_INSTALL_PORT: 3308
      ZENITH_CONFIG: ${{ github.workspace }}/backend/tests/config.php
      ZENITH_TEST_CONFIG: ${{ github.workspace }}/backend/tests/config.php
      ZENITH_BACKEND: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, curl, openssl
          coverage: none
      - name: PHP syntax and private test storage
        run: |
          find backend -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r '$c=require getenv("ZENITH_CONFIG"); foreach([$c["session_path"],$c["storage_path"]."/uploads"] as $p) {if(!is_dir($p))mkdir($p,0700,true);}'
      - run: php backend/tests/configure-cpanel.php
      - run: php backend/bin/migrate.php --config "$ZENITH_CONFIG"
      - run: php backend/tests/admin-password-rotation.php
      - run: php backend/tests/smtp-configuration.php
      - run: php backend/tests/core-integration.php
      - run: php backend/tests/core-mail-retry.php
      - run: php backend/tests/enquiries-integration.php
      - run: php backend/tests/catalog-integration.php
      - run: php backend/tests/locations-integration.php
      - run: php backend/tests/public-url.php
      - run: php backend/tests/mail-preview-policy.php
      - run: php backend/tests/commerce_unit.php
      - run: php backend/tests/commerce_integration.php "$ZENITH_CONFIG"
      - run: php backend/tests/commerce_concurrency.php "$ZENITH_CONFIG"
      - name: HTTP API acceptance
        run: |
          php -S 127.0.0.1:8080 -t backend/public backend/public/index.php > /tmp/zenith-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2)
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('API health check did not pass')
          PY
          php backend/tests/e2e.php
      - name: Isolated logical restore and financial reconciliation
        run: php backend/tests/backup-roundtrip.php "$ZENITH_CONFIG" backend/tests/restore-config.php
      - name: Private preview HTTP isolation
        run: php backend/tests/preview-http.php "$ZENITH_CONFIG" backend/tests/restore-config.php
      - name: Code-only preview activation and rollback
        run: php backend/tests/preview-activation.php "$ZENITH_CONFIG"
      - name: Private preview installation and real restore
        run: php backend/tests/preview-install.php "$ZENITH_CONFIG"

  deploy-preview:
    needs: [frontend, backend]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/feature/launch-experience' || github.ref == 'refs/heads/feature/commercial-completion') &&
      vars.CPANEL_PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cpanel-preview
    concurrency:
      group: cpanel-private-preview
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fashion-private-preview
          path: preview-artifact
      - name: Install private SSH identity
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/cpanel_preview
          if ! ssh-keygen -y -P '' -f ~/.ssh/cpanel_preview > /dev/null 2>&1; then
            echo "::error::CPANEL_SSH_KEY must contain the complete unencrypted private key file, including its BEGIN and END lines. Do not paste the key into logs or chat."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Stage and activate code-only private preview
        env:
          CPANEL_HOST: ${{ vars.CPANEL_HOST }}
          CPANEL_PORT: ${{ vars.CPANEL_PORT }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CPANEL_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          CPANEL_PORT="${CPANEL_PORT:-22}"
          [[ "$CPANEL_PORT" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          archive="preview-artifact/zenith-${SOURCE_SHA:0:12}-preview.tar.gz"
          test -f "$archive"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          ssh_args=(-i "$HOME/.ssh/cpanel_preview" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${ssh_args[@]}" -p "$CPANEL_PORT" "isp85@$CPANEL_HOST" 'umask 077; mkdir -p /home/isp85/fashion-private/deploy-inbox'
          scp "${ssh_args[@]}" -P "$CPANEL_PORT" "$archive" scripts/stage-cpanel-release.sh "isp85@$CPANEL_HOST:/home/isp85/fashion-private/deploy-inbox/"
          # A previously staged release is retained, allowing activation retries without re-extraction.
          ssh "${ssh_args[@]}" -p "$CPANEL_PORT" "isp85@$CPANEL_HOST" bash -s -- "$SOURCE_SHA" "$digest" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          digest="$2"
          private=/home/isp85/fashion-private
          release="$private/preview-releases/$sha"
          if [[ ! -d "$release" ]]; then
            bash "$private/deploy-inbox/stage-cpanel-release.sh" "$private/deploy-inbox/zenith-${sha:0:12}-preview.tar.gz" "$private" "$digest"
          fi
          /usr/local/bin/php "$release/private/backend/bin/activate-preview.php" --release "$release"
          REMOTE
      - name: Remove runner SSH identity
        if: always()
        run: rm -f ~/.ssh/cpanel_preview ~/.ssh/known_hosts
